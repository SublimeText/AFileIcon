[project]
name = "a-file-icon"
version = "4.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "cairosvg>=2.9.1",
    "pypng>=0.20220715.0",
    "ruff>=0.16.10",
]

[tool.black]
exclude = '''
/(
  | \.git
  | \.github
  | \.ruff_cache
  | \.venv
  | tests
  | vendor
)/
'''
line-length = 100
target-version = ["py314"]

[tool.ruff]
exclude = [
  ".git",
  ".github",
  "tests",
  "vendor"
]
lint.ignore = [
  "BLE001",
  "E722"      # bare except
]
line-length = 100
target-version = "py314"
